<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyStore - Shopping Cart</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #111827;
        }

        /* =========================
           NAVBAR
        ========================= */

        header {
            min-height: 72px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.12);
        }

        header h1 {
            font-size: 28px;
            margin: 0;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 24px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* =========================
           PAGE HEADER
        ========================= */

        .page-header {
            background: #1f2937;
            color: white;
            text-align: center;
            padding: 50px 20px 75px;
        }

        .page-header h2 {
            font-size: 40px;
            margin-bottom: 8px;
        }

        .page-header p {
            color: #d1d5db;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1150px;
            margin: -35px auto 70px;
            padding: 0 20px;
            position: relative;
        }

        .cart-layout {
            display: grid;
            grid-template-columns: 1fr 350px;
            gap: 25px;
            align-items: start;
        }

        /* =========================
           CART ITEMS
        ========================= */

        .cart-items {
            background: white;
            border-radius: 15px;
            padding: 25px;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,0.08);
        }

        .cart-heading {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }

        .cart-heading h3 {
            font-size: 22px;
        }

        .cart-item {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px;

            padding: 22px 0;

            border-bottom: 1px solid #eee;
        }

        .cart-item:last-child {
            border-bottom: none;
        }

        .item-info h3 {
            font-size: 20px;
            margin-bottom: 10px;
        }

        .item-info p {
            color: #6b7280;
            margin: 5px 0;
            font-size: 14px;
        }

        .item-price {
            font-weight: 700;
            color: #111827;
        }

        .item-subtotal {
            font-size: 18px;
            font-weight: 800;
            margin-top: 8px;
            color: #111827;
        }

        /* =========================
           QUANTITY
        ========================= */

        .item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .quantity-controls {
            display: flex;
            align-items: center;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            overflow: hidden;
        }

        .quantity-controls button {
            width: 38px;
            height: 38px;

            border: none;
            background: #f3f4f6;
            color: #111827;

            font-size: 20px;
            font-weight: bold;

            cursor: pointer;
        }

        .quantity-controls button:hover {
            background: #e5e7eb;
        }

        .quantity-number {
            min-width: 40px;
            text-align: center;
            font-weight: 700;
        }

        .remove-button {
            border: none;

            background: #fee2e2;
            color: #b91c1c;

            padding: 10px 14px;

            border-radius: 8px;

            cursor: pointer;

            font-weight: 700;
        }

        .remove-button:hover {
            background: #fecaca;
        }

        /* =========================
           SUMMARY
        ========================= */

        .cart-summary {
            background: white;

            border-radius: 15px;

            padding: 25px;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,0.08);

            position: sticky;
            top: 95px;
        }

        .cart-summary h3 {
            font-size: 22px;
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            gap: 15px;

            padding: 12px 0;

            color: #6b7280;

            border-bottom: 1px solid #eee;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;

            padding: 20px 0;

            font-size: 22px;
            font-weight: 800;

            color: #111827;
        }

        .checkout-button {
            width: 100%;

            border: none;

            padding: 15px;

            border-radius: 9px;

            background: #111827;
            color: white;

            font-size: 16px;
            font-weight: 800;

            cursor: pointer;
        }

        .checkout-button:hover {
            opacity: 0.85;
        }

        .continue-button {
            display: block;

            width: 100%;

            text-align: center;

            margin-top: 12px;

            padding: 13px;

            border-radius: 9px;

            background: #f3f4f6;

            color: #111827;

            text-decoration: none;

            font-weight: 700;
        }

        .continue-button:hover {
            background: #e5e7eb;
        }

        /* =========================
           EMPTY CART
        ========================= */

        .empty-cart {
            background: white;

            border-radius: 15px;

            padding: 70px 30px;

            text-align: center;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,0.08);
        }

        .empty-cart-icon {
            font-size: 60px;
            margin-bottom: 15px;
        }

        .empty-cart h3 {
            font-size: 26px;
            margin-bottom: 10px;
        }

        .empty-cart p {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .shop-button {
            display: inline-block;

            padding: 13px 22px;

            background: #111827;
            color: white;

            border-radius: 9px;

            text-decoration: none;

            font-weight: 700;
        }

        .shop-button:hover {
            opacity: 0.85;
        }

        /* =========================
           ERROR
        ========================= */

        .error-box {
            background: white;

            border-radius: 15px;

            padding: 50px;

            text-align: center;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,0.08);
        }

        .error-box h3 {
            color: #b91c1c;
            margin-bottom: 10px;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111827;
            color: white;

            text-align: center;

            padding: 35px;
        }

        footer p {
            color: #9ca3af;
            font-size: 14px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 850px) {

            header {
                min-height: auto;
                padding: 18px 20px;

                flex-direction: column;

                gap: 15px;
            }

            nav {
                justify-content: center;
                gap: 12px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                margin-top: -25px;
            }

            .cart-layout {
                grid-template-columns: 1fr;
            }

            .cart-summary {
                position: static;
            }

        }

        @media (max-width: 600px) {

            .page-header {
                padding: 40px 20px 65px;
            }

            .page-header h2 {
                font-size: 32px;
            }

            .cart-items {
                padding: 18px;
            }

            .cart-item {
                grid-template-columns: 1fr;
            }

            .item-actions {
                justify-content: flex-start;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header>

    <h1>
        MyStore
    </h1>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/products-page">
            Products
        </a>

        <a href="/cart-page">
            Cart
        </a>

        <a href="/orders-page">
            Orders
        </a>

        <a href="/login">
            Login
        </a>

    </nav>

</header>


<!-- =========================
     PAGE HEADER
========================= -->

<section class="page-header">

    <h2>
        Shopping Cart
    </h2>

    <p>
        Review your products before checkout.
    </p>

</section>


<!-- =========================
     CART
========================= -->

<main>

    <div id="cart-container">

        <div class="empty-cart">

            <div class="empty-cart-icon">
                🛒
            </div>

            <h3>
                Loading your cart...
            </h3>

            <p>
                Please wait.
            </p>

        </div>

    </div>


    <div id="cart-total"></div>

</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 MyStore. All rights reserved.
    </p>

</footer>


<script>


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// =========================================================
// LOAD CART
// =========================================================

async function loadCart() {

    const container =
        document.getElementById(
            "cart-container"
        );


    const totalContainer =
        document.getElementById(
            "cart-total"
        );


    container.innerHTML = `

        <div class="empty-cart">

            <div class="empty-cart-icon">
                🛒
            </div>

            <h3>
                Loading your cart...
            </h3>

        </div>

    `;


    try {

        const response =
            await fetch(
                "/cart",
                {
                    method: "GET"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            container.innerHTML = `

                <div class="error-box">

                    <h3>
                        Unable to load cart
                    </h3>

                    <p>
                        ${escapeHtml(
                            data.message ||
                            "Something went wrong."
                        )}
                    </p>

                </div>

            `;

            totalContainer.innerHTML =
                "";

            return;

        }


        const items =
            Array.isArray(data.items)
                ? data.items
                : [];


        /* EMPTY CART */

        if (
            items.length === 0
        ) {

            container.innerHTML = `

                <div class="empty-cart">

                    <div class="empty-cart-icon">
                        🛒
                    </div>

                    <h3>
                        Your cart is empty
                    </h3>

                    <p>
                        Looks like you haven't added
                        anything to your cart yet.
                    </p>

                    <a
                        href="/products-page"
                        class="shop-button"
                    >
                        Start Shopping
                    </a>

                </div>

            `;


            totalContainer.innerHTML =
                "";

            return;

        }


        let itemsHTML = "";


        items.forEach(
            function(item) {


                const price =
                    Number(
                        item.price || 0
                    );


                const subtotal =
                    Number(
                        item.subtotal || 0
                    );


                const quantity =
                    Number(
                        item.quantity || 1
                    );


                const cartItemId =
                    Number(
                        item.cart_item_id
                    );


                itemsHTML += `

                    <div class="cart-item">


                        <div class="item-info">

                            <h3>

                                ${escapeHtml(
                                    item.name
                                )}

                            </h3>


                            <p>

                                Price:
                                <span class="item-price">
                                    ₹${price.toFixed(2)}
                                </span>

                            </p>


                            <p>

                                Quantity:
                                ${quantity}

                            </p>


                            <div class="item-subtotal">

                                ₹${subtotal.toFixed(2)}

                            </div>

                        </div>


                        <div class="item-actions">


                            <div class="quantity-controls">


                                <button
                                    type="button"
                                    onclick="decreaseQuantity(
                                        ${cartItemId},
                                        ${quantity}
                                    )"
                                >
                                    −
                                </button>


                                <div class="quantity-number">

                                    ${quantity}

                                </div>


                                <button
                                    type="button"
                                    onclick="increaseQuantity(
                                        ${cartItemId},
                                        ${quantity}
                                    )"
                                >
                                    +
                                </button>


                            </div>


                            <button
                                type="button"
                                class="remove-button"
                                onclick="removeFromCart(
                                    ${cartItemId}
                                )"
                            >
                                Remove
                            </button>


                        </div>


                    </div>

                `;

            }
        );


        container.innerHTML = `

            <div class="cart-layout">


                <div class="cart-items">

                    <div class="cart-heading">

                        <h3>
                            Your Items
                        </h3>

                        <span>
                            ${items.length}
                            item${items.length === 1 ? "" : "s"}
                        </span>

                    </div>


                    ${itemsHTML}

                </div>


                <div id="summary-placeholder"></div>


            </div>

        `;


        const total =
            Number(
                data.total || 0
            );


        const summary =
            document.getElementById(
                "summary-placeholder"
            );


        summary.innerHTML = `

            <div class="cart-summary">

                <h3>
                    Order Summary
                </h3>


                <div class="summary-row">

                    <span>
                        Items
                    </span>

                    <span>
                        ${items.length}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Subtotal
                    </span>

                    <span>
                        ₹${total.toFixed(2)}
                    </span>

                </div>


                <div class="summary-row">

                    <span>
                        Delivery
                    </span>

                    <span>
                        Free
                    </span>

                </div>


                <div class="summary-total">

                    <span>
                        Total
                    </span>

                    <span>
                        ₹${total.toFixed(2)}
                    </span>

                </div>


                <button
                    type="button"
                    class="checkout-button"
                    onclick="checkout()"
                >
                    Proceed to Checkout
                </button>


                <a
                    href="/products-page"
                    class="continue-button"
                >
                    Continue Shopping
                </a>

            </div>

        `;


        /* Keep cart-total available */

        totalContainer.innerHTML =
            "";

    } catch (error) {

        console.error(
            "Load cart error:",
            error
        );


        container.innerHTML = `

            <div class="error-box">

                <h3>
                    Unable to connect
                </h3>

                <p>
                    Please refresh the page and try again.
                </p>

                <br>

                <a
                    href="/products-page"
                    class="shop-button"
                >
                    Continue Shopping
                </a>

            </div>

        `;


        totalContainer.innerHTML =
            "";

    }

}


// =========================================================
// UPDATE QUANTITY
// =========================================================

async function updateQuantity(
    cartItemId,
    quantity
) {

    quantity =
        Number(quantity);


    if (
        !Number.isInteger(quantity) ||
        quantity < 1
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/cart/" +
                encodeURIComponent(
                    cartItemId
                ) +
                "?quantity=" +
                encodeURIComponent(
                    quantity
                ),
                {
                    method: "PUT"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to update quantity."
            );

            return;

        }


        await loadCart();


    } catch (error) {

        console.error(
            "Update quantity error:",
            error
        );


        alert(
            "Something went wrong while updating the cart."
        );

    }

}


// =========================================================
// INCREASE
// =========================================================

function increaseQuantity(
    cartItemId,
    quantity
) {

    updateQuantity(
        cartItemId,
        Number(quantity) + 1
    );

}


// =========================================================
// DECREASE
// =========================================================

function decreaseQuantity(
    cartItemId,
    quantity
) {

    quantity =
        Number(quantity);


    if (
        quantity <= 1
    ) {

        removeFromCart(
            cartItemId
        );

        return;

    }


    updateQuantity(
        cartItemId,
        quantity - 1
    );

}


// =========================================================
// REMOVE
// =========================================================

async function removeFromCart(
    cartItemId
) {

    if (
        !confirm(
            "Remove this product from your cart?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/cart/" +
                encodeURIComponent(
                    cartItemId
                ),
                {
                    method: "DELETE"
                }
            );


        const data =
            await response.json();


        if (!response.ok) {

            alert(
                data.message ||
                "Unable to remove item."
            );

            return;

        }


        await loadCart();


    } catch (error) {

        console.error(
            "Remove cart item error:",
            error
        );


        alert(
            "Something went wrong while removing the item."
        );

    }

}


// =========================================================
// CHECKOUT
// =========================================================

function checkout() {

    window.location.href =
        "/checkout-page";

}


// =========================================================
// INITIAL LOAD
// =========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadCart();

    }
);

</script>


</body>

</html>
