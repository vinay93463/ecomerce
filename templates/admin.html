<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MyStore - Admin Dashboard</title>

    <link
        rel="stylesheet"
        href="/static/css/style.css"
    >

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f5f6f8;
            color: #111827;
        }

        /* =========================
           NAVBAR
        ========================= */

        header {
            min-height: 72px;
            background: #111827;
            color: white;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 7%;

            position: sticky;
            top: 0;
            z-index: 1000;

            box-shadow:
                0 3px 15px
                rgba(0,0,0,0.12);
        }

        header h1 {
            font-size: 27px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 22px;
            flex-wrap: wrap;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        nav a:hover {
            opacity: 0.7;
        }

        /* =========================
           MAIN
        ========================= */

        main {
            max-width: 1200px;
            margin: 45px auto 70px;
            padding: 0 20px;
        }

        .dashboard-header {
            margin-bottom: 30px;
        }

        .dashboard-header h2 {
            font-size: 36px;
            margin-bottom: 8px;
        }

        .dashboard-header p {
            color: #6b7280;
        }

        /* =========================
           CARDS
        ========================= */

        .admin-card {
            background: white;

            border-radius: 15px;

            padding: 30px;

            margin-bottom: 25px;

            box-shadow:
                0 6px 25px
                rgba(0,0,0,0.07);
        }

        .admin-card h3 {
            font-size: 23px;
            margin-bottom: 22px;
        }

        /* =========================
           FORM
        ========================= */

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .form-group {
            margin-bottom: 5px;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        label {
            display: block;

            font-size: 14px;

            font-weight: 700;

            margin-bottom: 8px;
        }

        input,
        textarea,
        select {
            width: 100%;

            padding: 12px 13px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-family: Arial, Helvetica, sans-serif;

            font-size: 14px;

            background: white;

            color: #111827;
        }

        textarea {
            min-height: 110px;

            resize: vertical;
        }

        input:focus,
        textarea:focus,
        select:focus {
            outline: none;

            border-color: #111827;

            box-shadow:
                0 0 0 3px
                rgba(17,24,39,0.08);
        }

        input[type="file"] {
            padding: 10px;
        }

        /* =========================
           BUTTONS
        ========================= */

        button {
            border: none;

            border-radius: 8px;

            padding: 11px 17px;

            background: #111827;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            opacity: 0.84;
        }

        button:disabled {
            background: #9ca3af;

            cursor: not-allowed;

            opacity: 1;
        }

        .submit-button {
            width: 100%;

            padding: 14px;

            font-size: 15px;

            margin-top: 5px;
        }

        .refresh-button {
            margin-bottom: 20px;
        }

        /* =========================
           MESSAGES
        ========================= */

        #product-message {
            margin-top: 18px;
        }

        .success-message {
            background: #ecfdf5;

            color: #065f46;

            border: 1px solid #a7f3d0;

            padding: 13px;

            border-radius: 8px;
        }

        .error-message {
            background: #fef2f2;

            color: #991b1b;

            border: 1px solid #fecaca;

            padding: 13px;

            border-radius: 8px;
        }

        /* =========================
           PRODUCT GRID
        ========================= */

        #products-container {
            display: grid;

            grid-template-columns:
                repeat(3, 1fr);

            gap: 20px;
        }

        .product-card {
            background: #fff;

            border: 1px solid #e5e7eb;

            border-radius: 13px;

            padding: 18px;

            box-shadow:
                0 3px 12px
                rgba(0,0,0,0.04);

            transition: 0.2s;
        }

        .product-card:hover {
            transform: translateY(-2px);

            box-shadow:
                0 7px 20px
                rgba(0,0,0,0.08);
        }

        .product-image {
            width: 100%;

            height: 190px;

            background: #f3f4f6;

            border-radius: 9px;

            display: flex;

            align-items: center;

            justify-content: center;

            overflow: hidden;

            margin-bottom: 15px;
        }

        .product-image img {
            width: 100%;

            height: 100%;

            object-fit: contain;

            padding: 10px;
        }

        .no-image {
            color: #9ca3af;

            font-size: 14px;
        }

        .product-card h4 {
            font-size: 18px;

            margin-bottom: 8px;
        }

        .product-description {
            color: #6b7280;

            font-size: 13px;

            line-height: 1.5;

            min-height: 40px;

            margin-bottom: 12px;
        }

        .product-meta {
            display: flex;

            justify-content: space-between;

            gap: 10px;

            padding: 10px 0;

            border-top: 1px solid #eee;

            border-bottom: 1px solid #eee;

            margin-bottom: 13px;
        }

        .product-price {
            font-size: 18px;

            font-weight: 800;
        }

        .product-stock {
            color: #047857;

            font-weight: 700;

            font-size: 13px;
        }

        .product-stock.out {
            color: #b91c1c;
        }

        .product-actions {
            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 8px;
        }

        .edit-button {
            background: #374151;
        }

        .delete-button {
            background: #991b1b;
        }

        /* =========================
           LOADING / EMPTY
        ========================= */

        .state-message {
            grid-column: 1 / -1;

            background: #f9fafb;

            border: 1px dashed #d1d5db;

            border-radius: 10px;

            padding: 35px;

            text-align: center;

            color: #6b7280;
        }

        /* =========================
           FOOTER
        ========================= */

        footer {
            background: #111827;

            color: white;

            text-align: center;

            padding: 30px;
        }

        footer p {
            color: #9ca3af;

            font-size: 13px;
        }

        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 950px) {

            #products-container {
                grid-template-columns:
                    repeat(2, 1fr);
            }

        }

        @media (max-width: 700px) {

            header {
                min-height: auto;

                padding: 18px 20px;

                flex-direction: column;

                gap: 15px;
            }

            nav {
                justify-content: center;

                gap: 12px;
            }

            nav a {
                font-size: 13px;
            }

            main {
                margin-top: 30px;
            }

            .dashboard-header h2 {
                font-size: 30px;
            }

            .admin-card {
                padding: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .form-group.full {
                grid-column: auto;
            }

            #products-container {
                grid-template-columns: 1fr;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     NAVBAR
========================= -->

<header>

    <h1>
        MyStore Admin
    </h1>


    <nav>

        <a href="/">
            Home
        </a>

        <a href="/products-page">
            Products
        </a>

        <a href="/cart-page">
            Cart
        </a>

        <a href="/orders-page">
            Orders
        </a>

        <a href="/admin">
            Admin
        </a>

        <a href="/admin/logout">
            Logout
        </a>

    </nav>

</header>


<!-- =========================
     MAIN
========================= -->

<main>


    <div class="dashboard-header">

        <h2>
            Admin Dashboard
        </h2>

        <p>
            Manage your MyStore products from one place.
        </p>

    </div>


    <!-- =========================
         ADD PRODUCT
    ========================= -->

    <section class="admin-card">

        <h3>
            Add New Product
        </h3>


        <form
            id="product-form"
            enctype="multipart/form-data"
        >

            <div class="form-grid">


                <div class="form-group">

                    <label for="name">
                        Product Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        maxlength="100"
                        placeholder="Enter product name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="category">
                        Category
                    </label>

                    <select id="category">

                        <option value="General">
                            General
                        </option>

                        <option value="Electronics">
                            Electronics
                        </option>

                        <option value="Clothing">
                            Clothing
                        </option>

                        <option value="Shoes">
                            Shoes
                        </option>

                        <option value="Books">
                            Books
                        </option>

                        <option value="Home">
                            Home
                        </option>

                    </select>

                </div>


                <div class="form-group full">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        maxlength="500"
                        placeholder="Enter product description"
                        required
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        placeholder="0.00"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="stock">
                        Stock
                    </label>

                    <input
                        type="number"
                        id="stock"
                        placeholder="0"
                        min="0"
                        step="1"
                        required
                    >

                </div>


                <div class="form-group full">

                    <label for="image">
                        Product Image
                    </label>

                    <input
                        type="file"
                        id="image"
                        accept="image/jpeg,image/png,image/webp,image/gif"
                    >

                </div>


                <div class="form-group full">

                    <button
                        type="submit"
                        class="submit-button"
                    >
                        + Add Product
                    </button>

                </div>


            </div>

        </form>


        <div id="product-message"></div>

    </section>


    <!-- =========================
         PRODUCTS
    ========================= -->

    <section class="admin-card">

        <h3>
            Product Management
        </h3>


        <button
            type="button"
            class="refresh-button"
            onclick="loadProducts()"
        >
            ↻ Refresh Products
        </button>


        <div id="products-container">

            <div class="state-message">
                Loading products...
            </div>

        </div>

    </section>


</main>


<!-- =========================
     FOOTER
========================= -->

<footer>

    <p>
        © 2026 MyStore Admin. All rights reserved.
    </p>

</footer>


<script>


// =========================================================
// ESCAPE HTML
// =========================================================

function escapeHtml(value) {

    const div =
        document.createElement("div");

    div.textContent =
        value ?? "";

    return div.innerHTML;

}


// =========================================================
// IMAGE URL
// =========================================================

function getImageUrl(image) {

    if (!image) {

        return "";

    }


    if (
        image.startsWith("/") ||
        image.startsWith("http://") ||
        image.startsWith("https://")
    ) {

        return image;

    }


    return "/static/images/" + image;

}


// =========================================================
// LOAD PRODUCTS
// =========================================================

async function loadProducts() {

    const container =
        document.getElementById(
            "products-container"
        );


    container.innerHTML = `

        <div class="state-message">

            Loading products...

        </div>

    `;


    try {

        const response =
            await fetch(
                "/products",
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        const products =
            await response.json();


        if (!response.ok) {

            container.innerHTML = `

                <div class="state-message">

                    ${escapeHtml(
                        products.message ||
                        products.detail ||
                        "Unable to load products."
                    )}

                </div>

            `;

            return;

        }


        if (
            !Array.isArray(products) ||
            products.length === 0
        ) {

            container.innerHTML = `

                <div class="state-message">

                    No products found.

                </div>

            `;

            return;

        }


        let html = "";


        products.forEach(
            function(product) {

                const imageUrl =
                    getImageUrl(
                        product.image
                    );


                const price =
                    Number(
                        product.price || 0
                    );


                const stock =
                    Number(
                        product.stock || 0
                    );


                const stockClass =
                    stock <= 0
                        ? "out"
                        : "";


                const imageHtml =
                    imageUrl
                        ? `

                            <img
                                src="${escapeHtml(
                                    imageUrl
                                )}"
                                alt="${escapeHtml(
                                    product.name
                                )}"
                                onerror="
                                    this.style.display='none';
                                    this.nextElementSibling.style.display='block';
                                "
                            >

                            <span
                                class="no-image"
                                style="display:none;"
                            >
                                No image available
                            </span>

                        `
                        : `

                            <span class="no-image">
                                No image available
                            </span>

                        `;


                html += `

                    <div class="product-card">


                        <div class="product-image">

                            ${imageHtml}

                        </div>


                        <h4>

                            ${escapeHtml(
                                product.name
                            )}

                        </h4>


                        <p class="product-description">

                            ${escapeHtml(
                                product.description
                            )}

                        </p>


                        <div class="product-meta">

                            <span class="product-price">

                                ₹${price.toFixed(2)}

                            </span>


                            <span
                                class="product-stock ${stockClass}"
                            >

                                Stock:
                                ${stock}

                            </span>

                        </div>


                        <p style="
                            color:#6b7280;
                            font-size:13px;
                            margin-bottom:13px;
                        ">

                            Category:
                            <strong>
                                ${escapeHtml(
                                    product.category ||
                                    "General"
                                )}
                            </strong>

                        </p>


                        <div class="product-actions">


                            <button
                                type="button"
                                class="edit-button"
                                onclick="editProduct(
                                    ${Number(product.id)}
                                )"
                            >
                                Edit
                            </button>


                            <button
                                type="button"
                                class="delete-button"
                                onclick="deleteProduct(
                                    ${Number(product.id)}
                                )"
                            >
                                Delete
                            </button>


                        </div>


                    </div>

                `;

            }
        );


        container.innerHTML =
            html;


    } catch (error) {

        console.error(
            "Load products error:",
            error
        );


        container.innerHTML = `

            <div class="state-message">

                Unable to connect to the server.

            </div>

        `;

    }

}


// =========================================================
// ADD PRODUCT
// =========================================================

document
    .getElementById("product-form")
    .addEventListener(
        "submit",
        async function(event) {

            event.preventDefault();


            const message =
                document.getElementById(
                    "product-message"
                );


            const formData =
                new FormData();


            formData.append(
                "name",
                document
                    .getElementById("name")
                    .value
                    .trim()
            );


            formData.append(
                "description",
                document
                    .getElementById("description")
                    .value
                    .trim()
            );


            formData.append(
                "price",
                document
                    .getElementById("price")
                    .value
            );


            formData.append(
                "stock",
                document
                    .getElementById("stock")
                    .value
            );


            formData.append(
                "category",
                document
                    .getElementById("category")
                    .value
            );


            const image =
                document
                    .getElementById("image")
                    .files[0];


            if (image) {

                formData.append(
                    "image",
                    image
                );

            }


            message.innerHTML = `

                <div class="success-message">

                    Adding product...

                </div>

            `;


            try {

                const response =
                    await fetch(
                        "/products",
                        {
                            method: "POST",
                            body: formData,
                            credentials: "same-origin"
                        }
                    );


                const data =
                    await response.json();


                if (response.ok) {

                    message.innerHTML = `

                        <div class="success-message">

                            ✓ Product added successfully!

                        </div>

                    `;


                    document
                        .getElementById(
                            "product-form"
                        )
                        .reset();


                    await loadProducts();


                } else {

                    message.innerHTML = `

                        <div class="error-message">

                            ${
                                escapeHtml(
                                    data.message ||
                                    data.detail ||
                                    "Unable to add product."
                                )
                            }

                        </div>

                    `;

                }


            } catch (error) {

                console.error(
                    "Add product error:",
                    error
                );


                message.innerHTML = `

                    <div class="error-message">

                        Server error while adding product.

                    </div>

                `;

            }

        }
    );


// =========================================================
// EDIT PRODUCT
// =========================================================

async function editProduct(
    productId
) {

    try {

        const response =
            await fetch(
                "/products/" +
                encodeURIComponent(
                    productId
                ),
                {
                    method: "GET",
                    credentials: "same-origin"
                }
            );


        const product =
            await response.json();


        if (!response.ok) {

            alert(
                product.message ||
                product.detail ||
                "Unable to get product."
            );

            return;

        }


        const name =
            prompt(
                "Product name:",
                product.name
            );


        if (name === null) {
            return;
        }


        const description =
            prompt(
                "Description:",
                product.description
            );


        if (description === null) {
            return;
        }


        const price =
            prompt(
                "Price:",
                product.price
            );


        if (price === null) {
            return;
        }


        const stock =
            prompt(
                "Stock:",
                product.stock
            );


        if (stock === null) {
            return;
        }


        const category =
            prompt(
                "Category:",
                product.category ||
                "General"
            );


        if (category === null) {
            return;
        }


        if (
            !name.trim() ||
            !description.trim()
        ) {

            alert(
                "Name and description cannot be empty."
            );

            return;

        }


        const numericPrice =
            Number(price);


        const numericStock =
            Number(stock);


        if (
            !Number.isFinite(
                numericPrice
            ) ||
            numericPrice < 0
        ) {

            alert(
                "Please enter a valid price."
            );

            return;

        }


        if (
            !Number.isInteger(
                numericStock
            ) ||
            numericStock < 0
        ) {

            alert(
                "Please enter a valid stock quantity."
            );

            return;

        }


        const params =
            new URLSearchParams();


        params.append(
            "name",
            name.trim()
        );


        params.append(
            "description",
            description.trim()
        );


        params.append(
            "price",
            numericPrice
        );


        params.append(
            "stock",
            numericStock
        );


        params.append(
            "category",
            category.trim() ||
            "General"
        );


        const updateResponse =
            await fetch(
                "/products/" +
                encodeURIComponent(
                    productId
                ) +
                "?" +
                params.toString(),
                {
                    method: "PUT",
                    credentials: "same-origin"
                }
            );


        const data =
            await updateResponse.json();


        if (updateResponse.ok) {

            alert(
                "Product updated successfully!"
            );


            await loadProducts();


        } else {

            alert(
                data.message ||
                data.detail ||
                "Unable to update product."
            );

        }


    } catch (error) {

        console.error(
            "Edit product error:",
            error
        );


        alert(
            "Something went wrong while editing."
        );

    }

}


// =========================================================
// DELETE PRODUCT
// =========================================================

async function deleteProduct(
    productId
) {

    if (
        !confirm(
            "Are you sure you want to delete this product?"
        )
    ) {

        return;

    }


    try {

        const response =
            await fetch(
                "/products/" +
                encodeURIComponent(
                    productId
                ),
                {
                    method: "DELETE",
                    credentials: "same-origin"
                }
            );


        const data =
            await response.json();


        if (response.ok) {

            alert(
                data.message ||
                "Product deleted successfully."
            );


            await loadProducts();


        } else {

            alert(
                data.message ||
                data.detail ||
                "Unable to delete product."
            );

        }


    } catch (error) {

        console.error(
            "Delete product error:",
            error
        );


        alert(
            "Unable to delete product."
        );

    }

}


// =========================================================
// INITIAL LOAD
// =========================================================

document.addEventListener(
    "DOMContentLoaded",
    function() {

        loadProducts();

    }
);

</script>


</body>

</html>
